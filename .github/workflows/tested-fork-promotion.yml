name: Tested-fork promotion

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tested-fork-promotion
  cancel-in-progress: false

jobs:
  stage:
    name: Stage and check candidate
    if: github.ref == 'refs/heads/optchat-maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.promote.outputs.publish }}
      candidate_sha: ${{ steps.promote.outputs.candidate_sha }}
      status: ${{ steps.promote.outputs.status }}
    steps:
      - name: Check out trusted maintenance control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check promotion failure and race handling
        run: python3 -m unittest discover -s tests -v

      - name: Stage and check isolated candidate
        id: promote
        run: >-
          python3 scripts/tested_fork.py stage
          --work-dir "$RUNNER_TEMP/optchat-stage"
          --artifacts "$RUNNER_TEMP/optchat-artifacts"
          --install-candidate-dependencies
        env:
          OPTCHAT_CONTROL_REVISION: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"

      - name: Preserve sanitized evidence and promotion bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-fork-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optchat-artifacts
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Compare-and-swap publish main
    needs: stage
    if: >-
      needs.stage.result == 'success' &&
      needs.stage.outputs.publish == 'true' &&
      github.ref == 'refs/heads/optchat-maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted maintenance control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's checked bundle and manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-fork-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optchat-artifacts

      - name: Verify evidence and compare-and-swap update main
        run: >-
          python3 scripts/tested_fork.py publish
          --artifacts "$RUNNER_TEMP/optchat-artifacts"
          --work-dir "$RUNNER_TEMP/optchat-publish"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPTCHAT_CONTROL_REVISION: ${{ github.sha }}
          PYTHONUNBUFFERED: "1"
